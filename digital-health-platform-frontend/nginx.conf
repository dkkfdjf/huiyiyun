# 慧医云前端容器 nginx 配置
# 与 deploy/nginx.conf.example 同语言;唯一实质区别:/api/ 反代到 compose 服务名 backend:8080(非 127.0.0.1)。
# gzip / 静态长缓存 / SPA history 回退 照旧。

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;
    gzip_vary on;

    # 反代后端接口(/api/ → compose 内 backend 服务:8080)
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 静态资源缓存(带 hash 的资产长期缓存)
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 前端 history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
